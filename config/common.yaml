# Shared defaults for reviewer-scale runs. Increase duration_seconds to 30 for
# the benchmark window used in the experiments.
max_concurrency_by_company:
  gemini: 2
  openai: 2
  anthropic: 1
  together: 2
  dashscope: 2
  random: 4
max_retries: 2
retry_backoff_seconds: 10
render_video_fps: 30
max_actions_per_turn: 10
duration_seconds: 5
frames_per_action: 3
minimal_logging: true
games:
  selected:
    - breakout
    - assault
  full:
    - all
